<script>
(function(){
  var cfg=window.NOTCH_SECTION;if(!cfg)return;
  var KEY='notch_section_timer';
  function fmt(ms){var s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  var tot=String(cfg.totalMinutes).padStart(2,'0')+':00';
  function getT(){try{return JSON.parse(sessionStorage.getItem(KEY));}catch(e){return null;}}
  var wrap=document.getElementById('section-timer-wrap');
  var disp=document.getElementById('section-timer');
  function tick(st){var e=Date.now()-st,r=e/(cfg.totalMinutes*60000);disp.textContent=fmt(e)+' / '+tot;disp.style.color=r>=1?'#ba1a1a':r>=0.8?'#d97706':'#51606b';}
  var st;
  if(cfg.isIntro){var ex=getT();if(ex&&ex.nn===cfg.nn){st=ex.startTime;}else{st=Date.now();sessionStorage.setItem(KEY,JSON.stringify({nn:cfg.nn,startTime:st}));}}
  else{var t=getT();if(!t||t.nn!==cfg.nn){if(wrap)wrap.style.display='none';return;}st=t.startTime;}
  tick(st);setInterval(function(){tick(st);},1000);
})();
</script>
